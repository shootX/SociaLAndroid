name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build debug and release APKs
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_NATIVE_ID: ${{ secrets.ADMOB_NATIVE_ID }}
          # Optional; empty values fall back to the defaults in app/build.gradle.kts.
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      # Google and Facebook sign-in are registered for this SHA-1 only (README → Provider setup).
      - name: Debug APK carries the registered signing key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/*.apk \
            | grep -q "SHA-1 digest: ca32fca6315d96f073da2171dc4912158df32ebe"

      - name: Lint (report only)
        run: ./gradlew --no-daemon :app:lintDebug
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: socialsave-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore
