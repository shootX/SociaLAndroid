org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AdMob: debug builds always use Google's public test ids. Release builds default to the production app and
# banner ids and read ADMOB_NATIVE_ID (and optional ADMOB_APP_ID / ADMOB_BANNER_ID overrides) from -P,
# ~/.gradle/gradle.properties or the environment (GitHub Actions secrets); the native id falls back to the test id.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
