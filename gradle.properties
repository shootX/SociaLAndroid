org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AdMob: debug builds always use Google's public test ids. Release builds read ADMOB_APP_ID and
# ADMOB_NATIVE_ID from -P, ~/.gradle/gradle.properties or the environment (GitHub Actions secrets),
# and fall back to the test ids when they are not set.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
